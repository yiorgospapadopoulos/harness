edge = { light = "rgba(16,24,40,0.1)", dark = "rgba(0,0,0,0.5)" }
highlight = { light = "rgba(255,255,255,0.95)", dark = "rgba(255,255,255,0.17)" }
rim = { light = "rgba(255,255,255,0.32)", dark = "rgba(255,255,255,0.05)" }
shadow_color = { light = "rgba(20,28,50,0.14)", dark = "rgba(0,0,0,0.45)" }
strip = { light = "rgba(238,239,242,0.5)", dark = "rgba(28,29,33,0.6)" }
shell = { light = "rgba(246,247,249,0.5)", dark = "rgba(36,37,42,0.55)" }

[glass.themes.options.smoke]
