# The daemon and web quality gates on Linux. The Swift gates (`make check-apple`) run locally.

name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: daemon (make check-daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # uv installs the Python from daemon/.python-version on the first `uv sync`.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: daemon/uv.lock

      - name: Install dependencies
        working-directory: daemon
        run: uv sync --locked

      - name: Gates
        run: make check-daemon

  web:
    name: web (make check-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Gates
        run: make check-web
