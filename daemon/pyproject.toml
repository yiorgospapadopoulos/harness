[project]
name = "harness"
version = "0.1.0"
description = "Daemon for harness, a personal agent manager."
authors = [
    { name = "Giorgos Papadopoulos", email = "giorgospapadopoulos002@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "claude-agent-sdk>=0.2.163",
    "fastapi>=0.142.2",
    "keyring>=25.7.0",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "tomli-w>=1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RET", "PTH", "ASYNC", "PT",
    "RUF", "ANN",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=harness",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
omit = ["*/harness/__main__.py"]
